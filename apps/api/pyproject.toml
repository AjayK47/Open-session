[project]
name = "open-session-api"
version = "0.1.0"
description = "Open-source conference program operating system - API (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.32.1",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "email-validator>=2.2.0",
    "jinja2>=3.1.5",
    "itsdangerous>=2.2.0",
    "icalendar>=6.0.1",
    "alembic>=1.14.0",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.20",
    "openai>=2.0.0",
    "httpx>=0.28.1",
    "cryptography>=44.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "httpx>=0.28.1",
    "ruff>=0.8.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
# B008: Depends() in argument defaults is the idiomatic FastAPI pattern.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ASYNC", "E501"]
# Long HTML template strings are intentionally single-line.
"app/services/communication_service.py" = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project]
name = "open-session-cloudflare-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "email-validator>=2.2.0",
    "fastapi>=0.115.6",
    "icalendar>=6.0.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.5",
    "openpyxl>=3.1.5",
    "pydantic>=2.10.4",
    "pydantic-settings>=2.7.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "sqlalchemy-cloudflare-d1==0.3.11",
]

[dependency-groups]
dev = [
    "workers-py==1.16.2",
    "workers-runtime-sdk==1.6.9",
]

[tool.uv]
package = false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Open Session</title>
    <script>
      // Applies the stored theme before first paint — without this the page
      // always flashes dark (the default) for a frame even when the visitor
      // previously chose light. Dark is the default for everyone regardless
      // of OS/browser preference; kept in sync with src/lib/theme.ts.
      (function () {
        try {
          if (localStorage.getItem("open-session-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Open Session — Open-source conference programme management</title>
    <meta
      name="description"
      content="Open Session replaces the CFP form, the review spreadsheet, the speaker email thread, and the scheduling doc with one system you run yourself. Free, open source, and self-hosted — MIT licensed."
    />
    <link rel="canonical" href="https://session.drawset.com/" />
    <meta name="theme-color" content="#4485EB" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Open Graph (Slack, LinkedIn, Facebook, Discord, ...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Open Session" />
    <meta property="og:title" content="Open Session — Open-source conference programme management" />
    <meta
      property="og:description"
      content="Replaces the CFP form, the review spreadsheet, the speaker email thread, and the scheduling doc with one system you run yourself."
    />
    <meta property="og:url" content="https://session.drawset.com/" />
    <meta property="og:image" content="https://session.drawset.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Open Session — Open-source conference programme management" />
    <meta
      name="twitter:description"
      content="Replaces the CFP form, the review spreadsheet, the speaker email thread, and the scheduling doc with one system you run yourself."
    />
    <meta name="twitter:image" content="https://session.drawset.com/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Open Session",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Any (self-hosted, Docker)",
        "description": "Open-source conference programme management: CFP forms, speaker portal, review and scoring, drag-and-drop agenda builder, and public event widgets.",
        "url": "https://session.drawset.com/",
        "license": "https://github.com/AjayK47/Open-session/blob/main/LICENSE",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <script>
      // Applies the stored theme before first paint — without this the page
      // always flashes dark (the default) for a frame even when the visitor
      // previously chose light. Dark is the default for everyone regardless
      // of OS/browser preference; kept in sync with src/lib/theme.ts.
      (function () {
        try {
          if (localStorage.getItem("open-session-theme") === "light") {
            document.documentElement.classList.add("light");
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
